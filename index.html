<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Core Web Vitals: prioritize the LCP hero image (first hero gallery frame — see ASSETS.heroPhotos) -->
    <link rel="preload" as="image" href="/assets/product/grit/ramp-german-shepherd-suv.jpg?v=2" fetchpriority="high" />

    <!-- Primary SEO -->
    <title>Paw Grip — Dog ramps and stairs</title>
    <meta
      name="description"
      content="Paw Grip makes the jump a walk: a foldable car ramp rated to 150 lb (Compact) or 250 lb (Extended), plus stairs for the bed, the couch, and the back seat."
    />
    <meta
      name="keywords"
      content="dog car ramp, foldable dog ramp, pet ramp for SUV, dog ramp for large dogs, senior dog ramp, folding dog ramp"
    />
    <link rel="canonical" href="https://pawgrip.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paw Grip" />
    <meta property="og:title" content="Paw Grip — Dog ramps and stairs" />
    <meta
      property="og:description"
      content="The jump becomes a walk. A foldable car ramp rated to 150 lb (Compact) or 250 lb (Extended), plus stairs for the bed, the couch, and the back seat."
    />
    <meta property="og:image" content="https://pawgrip.app/assets/product/grit/ramp-german-shepherd-suv.jpg?v=2" />
    <meta property="og:url" content="https://pawgrip.app/" />
    <meta property="product:price:amount" content="79.99" />
    <meta property="product:price:currency" content="USD" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paw Grip — Dog ramps and stairs" />
    <meta
      name="twitter:description"
      content="The jump becomes a walk. A foldable car ramp rated to 150 lb (Compact) or 250 lb (Extended), plus stairs for the bed, the couch, and the back seat."
    />
    <meta name="twitter:image" content="https://pawgrip.app/assets/product/grit/ramp-german-shepherd-suv.jpg?v=2" />

    <!--
      Structured data. The production build replaces this block per route
      from src/lib/seo.ts. Star counts mirror src/lib/catalog.ts.
    -->
    <script id="seo-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Paw Grip Foldable Dog Car Ramp",
        "image": "https://pawgrip.app/assets/product/grit/ramp-german-shepherd-suv.jpg?v=2",
        "description": "Folding dog car ramp rated to 150 lb (Compact) or 250 lb (Extended), with a grit traction deck and side rails. Folds in half for storage. Free insured shipping.",
        "brand": { "@type": "Brand", "name": "Paw Grip" },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "214",
          "bestRating": "5",
          "worstRating": "1"
        },
        "offers": {
          "@type": "Offer",
          "url": "https://pawgrip.app/",
          "priceCurrency": "USD",
          "price": "79.99",
          "availability": "https://schema.org/InStock",
          "shippingDetails": {
            "@type": "OfferShippingDetails",
            "shippingRate": { "@type": "MonetaryAmount", "value": "0", "currency": "USD" }
          },
          "hasMerchantReturnPolicy": {
            "@type": "MerchantReturnPolicy",
            "merchantReturnDays": 30,
            "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow"
          }
        }
      }
    </script>

      </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
