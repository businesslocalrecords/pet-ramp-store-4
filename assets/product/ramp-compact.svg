<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="Side view of the Compact 62-inch foldable dog car ramp on a white background">
  <defs>
    <linearGradient id="cc-deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57534E"/>
      <stop offset="50%" stop-color="#78716C"/>
      <stop offset="100%" stop-color="#57534E"/>
    </linearGradient>
    <linearGradient id="cc-rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <filter id="cc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Pure white background: Merchant Center requires a clean background -->
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <line x1="80" y1="646" x2="1120" y2="646" stroke="#E7E5E4" stroke-width="2"/>

  <!-- Ramp: side profile, 62" unfolded at a gentle slope -->
  <g filter="url(#cc-shadow)">
    <!-- Side rail -->
    <path d="M150 618 L887 308 L897 336 L160 648 Z" fill="url(#cc-rail)"/>
    <!-- Walking deck -->
    <path d="M160 648 L897 336 L910 372 L173 686 Z" fill="url(#cc-deck)"/>
    <!-- Rubber feet -->
    <rect x="138" y="678" width="46" height="26" rx="6" fill="#1C1917"/>
    <rect x="868" y="362" width="46" height="26" rx="6" fill="#1C1917" transform="rotate(-22.8 891 375)"/>
    <!-- Treads -->
    <g stroke="#A8A29E" stroke-width="3" opacity="0.5">
      <line x1="212" y1="596" x2="225" y2="634"/>
      <line x1="284" y1="562" x2="297" y2="600"/>
      <line x1="356" y1="528" x2="369" y2="566"/>
      <line x1="428" y1="494" x2="441" y2="532"/>
      <line x1="500" y1="460" x2="513" y2="498"/>
      <line x1="572" y1="426" x2="585" y2="464"/>
      <line x1="644" y1="392" x2="657" y2="430"/>
      <line x1="716" y1="358" x2="729" y2="396"/>
      <line x1="788" y1="324" x2="801" y2="362"/>
    </g>
  </g>

  <!-- Dimension line: unfolded length -->
  <g stroke="#A8A29E" stroke-width="1.5">
    <line x1="150" y1="726" x2="900" y2="726"/>
    <line x1="150" y1="712" x2="150" y2="740"/>
    <line x1="900" y1="712" x2="900" y2="740"/>
  </g>
  <text x="525" y="768" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#57534E" text-anchor="middle">62 in unfolded</text>

  <!-- Folded length note -->
  <text x="525" y="60" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#A8A29E" text-anchor="middle">Compact &#183; folds to 31 in</text>
</svg>
