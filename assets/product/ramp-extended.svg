<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="Side view of the Extended 70-inch foldable dog car ramp on a white background">
  <defs>
    <linearGradient id="ce-deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57534E"/>
      <stop offset="50%" stop-color="#78716C"/>
      <stop offset="100%" stop-color="#57534E"/>
    </linearGradient>
    <linearGradient id="ce-rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <filter id="ce-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Pure white background: Merchant Center requires a clean background -->
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <line x1="80" y1="646" x2="1120" y2="646" stroke="#E7E5E4" stroke-width="2"/>

  <!-- Ramp: side profile, 70" unfolded at a gentler slope -->
  <g filter="url(#ce-shadow)">
    <!-- Side rail -->
    <path d="M130 618 L986 308 L996 336 L140 648 Z" fill="url(#ce-rail)"/>
    <!-- Walking deck (wider than the Compact) -->
    <path d="M140 648 L996 336 L1010 376 L153 688 Z" fill="url(#ce-deck)"/>
    <!-- Rubber feet -->
    <rect x="118" y="680" width="46" height="26" rx="6" fill="#1C1917"/>
    <rect x="968" y="360" width="46" height="26" rx="6" fill="#1C1917" transform="rotate(-20.1 991 373)"/>
    <!-- Treads -->
    <g stroke="#A8A29E" stroke-width="3" opacity="0.5">
      <line x1="196" y1="596" x2="209" y2="636"/>
      <line x1="274" y1="560" x2="287" y2="600"/>
      <line x1="352" y1="524" x2="365" y2="564"/>
      <line x1="430" y1="488" x2="443" y2="528"/>
      <line x1="508" y1="452" x2="521" y2="492"/>
      <line x1="586" y1="416" x2="599" y2="456"/>
      <line x1="664" y1="380" x2="677" y2="420"/>
      <line x1="742" y1="344" x2="755" y2="384"/>
      <line x1="820" y1="308" x2="833" y2="348"/>
      <line x1="898" y1="272" x2="911" y2="312"/>
    </g>
  </g>

  <!-- Dimension line: unfolded length -->
  <g stroke="#A8A29E" stroke-width="1.5">
    <line x1="130" y1="728" x2="1000" y2="728"/>
    <line x1="130" y1="714" x2="130" y2="742"/>
    <line x1="1000" y1="714" x2="1000" y2="742"/>
  </g>
  <text x="565" y="770" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#57534E" text-anchor="middle">70 in unfolded</text>

  <!-- Folded length note -->
  <text x="565" y="60" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#A8A29E" text-anchor="middle">Extended &#183; folds to 35 in</text>
</svg>
