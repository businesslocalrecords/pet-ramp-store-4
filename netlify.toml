# RETIRED — Netlify is no longer part of this project's workflow. Deploys go
# to the domain.com (cPanel) subdomain via GitHub Actions; DEPLOYMENT.md is
# the working agreement, public/.htaccess is the live equivalent of the
# redirects and headers below. This file is kept only until the first
# successful deploy is verified on the new host, then it should be deleted.
#
# ---------------------------------------------------------------------------
# Historical reference — the original Netlify build configuration:
#
# Vite inlines import.meta.env.VITE_* variables at BUILD time, so the five
# site variables must be set in Netlify's dashboard (Site configuration ->
# Environment variables) and a NEW deploy triggered whenever they change.
# Refreshing the page does nothing.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned to match the local toolchain (Vite 8, TypeScript ~6, oxlint).
  # Bump this if you upgrade the toolchain.
  NODE_VERSION = "22"

# The site is a single client-rendered page with no router, so no SPA
# rewrite is required for it. Static pages (shipping, returns, warranty,
# privacy, terms, contact, about, guide) live as real files in public/, and
# Netlify serves an existing file before applying this rewrite, so the
# catch-all only affects unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Long-cache the hashed build assets; index.html must stay revalidatable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
