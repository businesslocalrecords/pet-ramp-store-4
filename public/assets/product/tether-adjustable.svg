<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="An adjustable car safety tether: a webbing strap with a slider buckle and a metal clip, shown on a white background">
  <defs>
    <linearGradient id="tt-strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716C"/>
      <stop offset="50%" stop-color="#57534E"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>
    <linearGradient id="tt-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="50%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>
    <filter id="tt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1C1917" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>
  <line x1="80" y1="646" x2="1120" y2="646" stroke="#E7E5E4" stroke-width="2"/>

  <g filter="url(#tt-shadow)">
    <!-- Webbing strap, gentle S-curve -->
    <path d="M150 430 C 340 400, 520 470, 700 430 L 700 486 C 520 526, 340 456, 150 486 Z" fill="url(#tt-strap)"/>
    <!-- Stitch lines along both strap edges -->
    <path d="M162 442 C 340 414, 512 480, 690 442" stroke="#292524" stroke-width="2" stroke-dasharray="10 8" opacity="0.6" fill="none"/>
    <path d="M162 474 C 340 446, 512 512, 690 474" stroke="#292524" stroke-width="2" stroke-dasharray="10 8" opacity="0.6" fill="none"/>

    <!-- Adjustable slider buckle -->
    <g>
      <rect x="470" y="404" width="120" height="108" rx="14" fill="url(#tt-metal)"/>
      <rect x="500" y="430" width="60" height="16" rx="8" fill="#18181B"/>
      <rect x="500" y="470" width="60" height="16" rx="8" fill="#18181B"/>
      <rect x="486" y="452" width="88" height="12" rx="6" fill="#27272A"/>
    </g>

    <!-- Loop / D-ring at the left end -->
    <g>
      <rect x="128" y="416" width="46" height="84" rx="12" fill="none" stroke="url(#tt-metal)" stroke-width="16"/>
    </g>

    <!-- Seatbelt-style clip at the right end -->
    <g>
      <rect x="700" y="410" width="150" height="96" rx="12" fill="url(#tt-metal)"/>
      <rect x="726" y="436" width="98" height="44" rx="8" fill="#18181B"/>
      <circle cx="852" cy="458" r="20" fill="none" stroke="url(#tt-metal)" stroke-width="14"/>
    </g>
  </g>

  <text x="600" y="716" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#57534E" text-anchor="middle">Adjustable Car Safety Tether</text>
</svg>
