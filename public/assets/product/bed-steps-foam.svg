<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="A set of orthopedic foam pet steps ascending, with removable covers, shown on a white background">
  <defs>
    <linearGradient id="bs-foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6D3D1"/>
      <stop offset="100%" stop-color="#A8A29E"/>
    </linearGradient>
    <linearGradient id="bs-cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716C"/>
      <stop offset="100%" stop-color="#57534E"/>
    </linearGradient>
    <filter id="bs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1C1917" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>
  <line x1="80" y1="646" x2="1120" y2="646" stroke="#E7E5E4" stroke-width="2"/>

  <!-- Step 1 (lowest, front) -->
  <g filter="url(#bs-shadow)">
    <rect x="150" y="520" width="300" height="126" rx="18" fill="url(#bs-foam)"/>
    <rect x="150" y="520" width="300" height="46" rx="18" fill="url(#bs-cover)"/>
    <rect x="168" y="596" width="264" height="6" rx="3" fill="#78716C" opacity="0.5"/>
  </g>

  <!-- Step 2 (middle) -->
  <g filter="url(#bs-shadow)">
    <rect x="450" y="410" width="300" height="236" rx="18" fill="url(#bs-foam)"/>
    <rect x="450" y="410" width="300" height="46" rx="18" fill="url(#bs-cover)"/>
    <rect x="468" y="596" width="264" height="6" rx="3" fill="#78716C" opacity="0.5"/>
  </g>

  <!-- Step 3 (tallest, back) -->
  <g filter="url(#bs-shadow)">
    <rect x="750" y="300" width="300" height="346" rx="18" fill="url(#bs-foam)"/>
    <rect x="750" y="300" width="300" height="46" rx="18" fill="url(#bs-cover)"/>
    <rect x="768" y="596" width="264" height="6" rx="3" fill="#78716C" opacity="0.5"/>
    <!-- zip seam indicating a removable cover -->
    <path d="M770 470 L1030 470" stroke="#57534E" stroke-width="3" stroke-dasharray="8 7" opacity="0.6"/>
  </g>

  <text x="600" y="700" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#57534E" text-anchor="middle">Orthopedic Foam Bed Steps</text>
</svg>
