name: Deploy -> Linode (pawgrip.app)

# Auto-deploy the storefront to the Linode VPS that serves pawgrip.app
# (Cloudflare-fronted). On push to main: build here with the VITE_* values
# inlined, then rsync the built dist/ to the VPS webroot over SSH. The two
# Shopify Storefront creds (VITE_SHOPIFY_STOREFRONT_DOMAIN / _TOKEN) are read
# from repo *variables* (public-by-design); the rest come from *secrets*. No
# secrets are ever written to disk in the repo — set them in Settings >
# Secrets and variables > Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-linode
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (VITE_* inlined at build time)
        env:
          VITE_SHOPIFY_STOREFRONT_DOMAIN: ${{ vars.VITE_SHOPIFY_STOREFRONT_DOMAIN }}
          VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ vars.VITE_SHOPIFY_STOREFRONT_TOKEN }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ vars.VITE_GOOGLE_ADS_CONVERSION_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_MICROSOFT_UET_TAG_ID: ${{ vars.VITE_MICROSOFT_UET_TAG_ID }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Rsync dist/ to the VPS webroot over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}          # Linode public IPv4 (CF does not proxy SSH)
          VPS_USER: ${{ secrets.VPS_USER }}          # e.g. 'deploy'
          VPS_PORT: ${{ secrets.VPS_PORT }}          # usually 22
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH }}   # e.g. /var/www/pawgrip.app
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}   # base64 of the private key, one line
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          # VPS_SSH_KEY_B64 = base64 of the private key on ONE line. Generate it:
          #   Linux/macOS:   base64 -w0 linode_deploy
          #   Windows PS:    [Convert]::ToBase64String([IO.File]::ReadAllBytes('linode_deploy'))
          # This avoids the CRLF / multi-line pitfalls of pasting a raw key.
          printf '%s' "${VPS_SSH_KEY_B64}" | tr -d '\r\n \t' | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "key first line: $(head -n1 ~/.ssh/id_ed25519)"
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY_B64 did not decode to a usable PRIVATE key. Set the secret to base64 of the 'linode_deploy' private key file (see the command above)." >&2
            exit 1
          fi
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p ${VPS_PORT:-22}" \
            dist/ "${VPS_USER}@${VPS_HOST}:${VPS_PATH:-/var/www/pawgrip.app}/"
