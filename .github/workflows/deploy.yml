# Deploy pipeline for the pawgrip subdomain on Network Solutions (cPanel).
#
# The host blocks every file-transfer and cPanel-API port from GitHub's
# datacenter IP ranges (only 443 site traffic passes — verified with
# probe.yml on 2026-10-13: github.com:22 and host:443 reachable, but
# 21/22/2222/2083/2082 all filtered). So an Actions-side SFTP upload can
# never connect. The pipeline therefore runs in two stages, both on 443:
#
#   stage 1 (this workflow): build dist/ and push it to the public
#     `publish` branch of this repo (codeload/git over 443 — allowed).
#   stage 2 (host side, one-time setup): a cPanel cron job, once per
#     minute, downloads the branch tarball and extracts it into
#     htdocs/pawgrip. The server pulls FROM GitHub, so the host's inbound
#     block does not apply.
#
# Netlify's contract (push to main -> live site) is preserved: the cron
# polls every minute, so end-to-end latency is the build time plus <=1
# minute. DEPLOYMENT.md is the working agreement (findings, cron command,
# rollout checklist); ns.env (gitignored) holds fallback credentials.
name: Deploy to Network Solutions subdomain

on:
  push:
    branches: [main]
    # Only site-affecting files — doc-only pushes must not burn a deploy run.
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'ns.env.example'
  workflow_dispatch:          # manual redeploy button, same as Netlify's "Trigger deploy"

permissions:
  contents: write             # push the publish branch with the default token

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22    # matches local tooling (AGENTS.md)
          cache: npm

      - run: npm ci
      - run: npm run build     # tsc -b && vite build -> dist/
        env:
          VITE_SHOPIFY_STOREFRONT_DOMAIN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_DOMAIN }}
          VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_TOKEN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ secrets.VITE_GOOGLE_ADS_CONVERSION_ID }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_REQUIRE_BUSINESS_INFO: ${{ vars.VITE_REQUIRE_BUSINESS_INFO }}

      - name: Publish dist/ to the publish branch (server pulls it)
        run: |
          set -euo pipefail
          # stage the build so the publish branch holds dist/ contents at
          # its root (dotfiles included — dist/.htaccess must survive)
          rm -rf /tmp/publish-stage
          mkdir -p /tmp/publish-stage
          cp -a dist/. /tmp/publish-stage/

          # deploy marker: the cron compares this (a ~50-byte fetch) against
          # the last one it applied and only downloads the ~8 MB tarball when
          # it differs — codeload ignores conditional requests, so this is
          # what keeps the once-per-minute poll cheap.
          echo "$GITHUB_SHA" > /tmp/publish-stage/deploy-version.txt

          # orphan branch: replace whatever publish held with this build
          git checkout --orphan publish
          git rm -r --cached --quiet . > /dev/null
          find . -maxdepth 1 -mindepth 1 -not -name .git -not -name dist -exec rm -rf {} +
          rm -rf dist
          cp -a /tmp/publish-stage/. .

          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "deploy $GITHUB_SHA"
          git push -f origin publish
