# TEMPORARY diagnostic/verification workflow.
#   1. port probe — which file-transfer ports the host accepts from GitHub's
#      runners (the workspace sandbox is proxy-blocked, so this must run on a
#      hosted runner)
#   2. HTTP probe — what the web server actually serves for the deploy hook's
#      candidate paths, with body snippets (our PHP 403 "forbidden" means the
#      file is reachable; an openresty 404/403 means the proxy/backend never
#      found it)
#   3. deploy verification — the /pawgrip/ site paths, one hashed asset
#      pulled out of index.html, the SPA catch-all (a bogus path must return
#      index.html, proving .htaccess works) and the subdomain's status
# Dispatch manually:
#   gh workflow run probe.yml -R businesslocalrecords/pet-ramp-store-4
# Delete once the deploy chain is verified.
name: Probe host ports

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe file-transfer ports
        run: |
          probe() {
            host=$1; port=$2
            if timeout 6 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
              echo "$host:$port OPEN"
            else
              echo "$host:$port closed/filtered"
            fi
          }
          probe github.com 22
          probe 122846c.netsolhost.com 443
          probe 122846c.netsolhost.com 80
          probe pawgrip.businesslocalrecords.com 80

      - name: Probe deploy hook paths over HTTP
        run: |
          for u in \
            "http://122846c.netsolhost.com/pawgrip/deploy.php" \
            "http://pawgrip.businesslocalrecords.com/deploy.php" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$u" || echo ERR)
            echo "$code  $u"
          done

      - name: Verify the deployed site
        run: |
          base="http://122846c.netsolhost.com/pawgrip"
          echo "--- index.html"
          curl -s -o /tmp/index.html -w "HTTP %{http_code}, %{size_download} bytes\n" --max-time 30 "$base/index.html"
          echo "--- one hashed asset referenced by index.html"
          asset=$(grep -o '/assets/index-[^"]*\.\(css\|js\)' /tmp/index.html | head -1)
          if [ -n "$asset" ]; then
            curl -s -o /dev/null -w "HTTP %{http_code}  $base$asset\n" --max-time 30 "$base$asset"
          else
            echo "no asset reference found in index.html"
          fi
          echo "--- SPA catch-all: a bogus path must return the app (200), not a 404"
          curl -s -o /dev/null -w "HTTP %{http_code}  $base/this-page-does-not-exist\n" --max-time 30 "$base/this-page-does-not-exist"
          echo "--- static policy page"
          curl -s -o /dev/null -w "HTTP %{http_code}  $base/shipping/\n" --max-time 30 "$base/shipping/"
          echo "--- click tracker: GET must be refused (405, POST-only)"
          curl -s -o /dev/null -D /tmp/track-headers.txt -w "HTTP %{http_code}  GET $base/track.php\n" --max-time 20 "$base/track.php"
          grep -i '^allow:' /tmp/track-headers.txt || echo "(no Allow header seen)"
          echo "--- click tracker end-to-end: POST a probe line, then read it back"
          curl -s -o /dev/null -w "HTTP %{http_code}  POST $base/track.php\n" --max-time 20 \
            -X POST -d "path=/__deploy-probe" "$base/track.php"
          curl -s --max-time 20 "$base/clicks.txt" | tail -1
          echo "--- deploy hook's version gate (should say already up to date now)"
          curl -s --max-time 30 "http://122846c.netsolhost.com/pawgrip/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}"
          echo ""
          echo "--- subdomain host routing (host-side; may still be pending)"
          curl -s -o /dev/null -w "HTTP %{http_code}  http://pawgrip.businesslocalrecords.com/\n" --max-time 30 "http://pawgrip.businesslocalrecords.com/"
