# TEMPORARY diagnostic workflow. Two sections:
#   1. port probe — which file-transfer ports the host accepts from GitHub's
#      runners (the workspace sandbox is proxy-blocked, so this must run on a
#      hosted runner)
#   2. HTTP probe — what the web server actually serves for the deploy hook's
#      candidate paths, with body snippets (our PHP 403 "forbidden" means the
#      file is reachable; an openresty 404/403 means the proxy/backend never
#      found it)
# Dispatch manually:
#   gh workflow run probe.yml -R businesslocalrecords/pet-ramp-store-4
# Delete once the deploy chain is verified.
name: Probe host ports

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe file-transfer ports
        run: |
          probe() {
            host=$1; port=$2
            if timeout 6 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
              echo "$host:$port OPEN"
            else
              echo "$host:$port closed/filtered"
            fi
          }
          probe github.com 22
          probe 122846c.netsolhost.com 443
          probe 122846c.netsolhost.com 80
          probe pawgrip.businesslocalrecords.com 80

      - name: Probe deploy hook paths over HTTP
        run: |
          for u in \
            "http://pawgrip.businesslocalrecords.com/deploy.php" \
            "http://122846c.netsolhost.com/pawgrip/deploy.php" \
            "http://122846c.netsolhost.com/deploy.php" \
            "http://pawgrip.businesslocalrecords.com/" \
            "http://pawgrip.businesslocalrecords.com/index.html" \
            "http://122846c.netsolhost.com/pawgrip/" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$u" || echo ERR)
            body=$(curl -s --max-time 20 "$u" | tr -d '\n' | head -c 160 || true)
            echo "$code  $u"
            echo "     body: $body"
          done
