# TEMPORARY diagnostic workflow — probes which file-transfer ports the host
# actually accepts from GitHub's runners (the workspace sandbox only allows
# web traffic, so this has to run on a hosted runner). Dispatch manually:
#   gh workflow run probe.yml -R businesslocalrecords/pet-ramp-store-4
# Delete once the deploy port is confirmed and the deploy workflow succeeds.
name: Probe host ports

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe file-transfer ports
        run: |
          probe() {
            host=$1; port=$2
            if timeout 6 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
              banner=$(timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port; head -c 80 <&3" 2>/dev/null | tr -d '\0' || true)
              echo "$host:$port OPEN   banner: $banner"
            else
              echo "$host:$port closed/filtered"
            fi
          }
          # controls first: if these are closed, the probe itself is broken
          probe github.com 22
          probe 122846c.netsolhost.com 443
          # file-transfer ports on the cPanel host
          probe 122846c.netsolhost.com 21
          probe 122846c.netsolhost.com 22
          probe 122846c.netsolhost.com 2222
          # cPanel API ports (HTTPS APIs would bypass the FTP block entirely)
          probe 122846c.netsolhost.com 2083
          probe 122846c.netsolhost.com 2082
          # alternate file-transfer hostnames for the domain
          probe ftp.businesslocalrecords.com 21
          probe ftp.businesslocalrecords.com 2222
          probe sftp.businesslocalrecords.com 22
